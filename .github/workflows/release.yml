name: Release Build

# Fires when a release is published: builds the archive at the release's
# tag, publishes the abstractions package to NuGet under the same version,
# uploads the archive to the release, and writes the release entry into the
# manifest on the `metadata` branch.

on:
  release:
    types: [published]

env:
  # The published manifest lives on a branch of its own and CI writes
  # nowhere else. A manifest committed to `stable` is a bot commit on the
  # branch people work from, which everyone then has to pull before their
  # next push.
  METADATA_BRANCH: metadata
  # One manifest at the branch root. This repository holds one plugin and
  # cuts stable releases alone, so there is neither a plugin axis nor a
  # channel axis to spend a path segment on.
  MANIFEST_PATH: manifest.json
  # GitHub serves release assets from its own download route under the
  # repository, so the base is the server and repository this run already
  # names rather than a CDN in front of them.
  ASSET_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download

jobs:
  build:
    # Pinned. `ubuntu-latest` is a moving pointer, and 24.04 is the image
    # that carries node24, which the action pins below need, node20 being
    # end of life.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write  # NuGet trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The image has no SDK. `global-json-file` rather than a literal
      # version, so this cannot drift from what a developer builds with.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Fetch the live manifest
        run: |
          # checkout only sets up a remote-tracking ref for the branch it
          # checked out, hence the explicit refspec.
          #
          # It goes to the runner's temp folder, outside the work tree: the
          # plugin's identity comes from its project, and the manifest is
          # only what shoko-build adds the release entry to.
          #
          # No fallback. The branch is seeded by hand once. A fetch of a
          # refspec naming a branch the remote does not have exits 128 with
          # "couldn't find remote ref", so a first run stops here, before
          # the build and well before the upload.
          git fetch --no-tags origin "+refs/heads/${METADATA_BRANCH}:refs/remotes/origin/${METADATA_BRANCH}"
          git show "origin/${METADATA_BRANCH}:${MANIFEST_PATH}" > "${RUNNER_TEMP}/manifest.json"

      - name: Read the release notes
        env:
          # Through the environment rather than as an expression inside
          # `run:`. Release notes are arbitrary markdown from a human, and
          # interpolating them into a shell script would let a backtick or
          # a `$(` in someone's notes run as a command on the runner.
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # GitHub carries the body on the release event, so it is taken
          # from there rather than read back from the API. The file is
          # always written, empty when the release carries no body: a
          # --release-notes-path shoko-build cannot read stops it, while an
          # empty one just leaves the notes off the release entry.
          printf '%s' "${RELEASE_BODY}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Build
        run: dotnet build Shoko.Plugin.OfflineImporter.slnx --configuration Release

      - name: Test
        run: dotnet test Shoko.Plugin.OfflineImporter.slnx --configuration Release --no-build

      # Packed from the build above, before shoko-build builds the plugin
      # again, and checked against it: `--no-build` packs whatever DLL is in
      # the output folder, so the step compares the packed one with the one
      # just built. The plugin and the package share the version in
      # Directory.Build.props, which has to be the tag's.
      - name: Pack the abstractions
        env:
          TAG: ${{ github.event.release.tag_name }}
          PROJECT_DIR: source/Shoko.Plugin.OfflineImporter.Abstractions
          PACKAGE_ID: Shoko.Plugin.OfflineImporter.Abstractions
        run: |
          version="$(dotnet msbuild "${PROJECT_DIR}" -getProperty:Version)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::The version in Directory.Build.props (${version}) is not the tag's (${TAG})."
            exit 1
          fi
          dotnet pack "${PROJECT_DIR}" --configuration Release --no-build --output "${RUNNER_TEMP}/nuget"
          package="${RUNNER_TEMP}/nuget/${PACKAGE_ID}.${version}.nupkg"
          unzip -p "${package}" "lib/net10.0/${PACKAGE_ID}.dll" > "${RUNNER_TEMP}/packed.dll"
          if ! cmp -s "${RUNNER_TEMP}/packed.dll" "${PROJECT_DIR}/bin/Release/net10.0/${PACKAGE_ID}.dll"; then
            echo "::error::The packed ${PACKAGE_ID}.dll is not the one just built."
            exit 1
          fi

      # The newest shoko-build, so every release records what the newest
      # manifest format holds. The update names the version it installed;
      # the pin in .config/dotnet-tools.json is only the floor for local
      # builds.
      - name: Install the newest build tool
        run: dotnet tool update --local shoko.buildtools

      # shoko-build discovers the plugin tags from the source, builds the
      # project, packs the whole output directory (dependencies and the
      # .deps.json included, not just the plugin assembly), checksums the
      # archive and writes the release entry into the manifest with the
      # abstraction version the assembly was actually compiled against. It
      # reads the project from the working directory, hence the plugin's
      # folder, and updates the manifest in place: the live one the step
      # above fetched into the runner's temp folder.
      - name: Build and package
        working-directory: source/Shoko.Plugin.OfflineImporter
        run: |
          dotnet shoko-build \
            --configuration Release \
            --channel Stable \
            --tag "${{ github.event.release.tag_name }}" \
            --release-notes-path "${RUNNER_TEMP}/release-notes.md" \
            --manifest "${RUNNER_TEMP}/manifest.json" \
            --output "${GITHUB_WORKSPACE}/dist/{name}-{tag}-{runtime}.zip" \
            --url "${ASSET_BASE_URL}/{tag}/{name}-{tag}-{runtime}.zip"

      # Before the upload, so a run that fails here leaves the release
      # without its archive and the feed without the release, and a re-run
      # skips a package NuGet already has. Trusted publishing: the job's
      # OIDC token is traded for a short-lived API key, so no key is stored.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.nuget_user }}

      - name: Publish the abstractions to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "${RUNNER_TEMP}/nuget/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # A glob rather than a name, so an archive per runtime identifier
      # uploads without touching this step.
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.zip \
            --repo "${{ github.repository }}"

      - name: Commit the manifest on the metadata branch
        run: |
          # The manifest waits in RUNNER_TEMP, outside the work tree. The
          # work tree has to be clean to switch branches, and the tool
          # update above changed .config/dotnet-tools.json, hence the reset.
          git reset --hard
          git checkout -B "${METADATA_BRANCH}" "origin/${METADATA_BRANCH}"
          cp "${RUNNER_TEMP}/manifest.json" "${MANIFEST_PATH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${MANIFEST_PATH}"
          # The only commit and the only push, and it is on the metadata
          # branch. Nothing lands on a source branch, so nobody has to
          # pull a bot commit before their next change.
          #
          # Guarded, because `git commit` exits 1 on an empty index and
          # this step runs after the asset is uploaded: a re-run that
          # produced a byte-identical manifest would otherwise fail a
          # release that had already succeeded.
          if git diff --cached --quiet; then
            echo "Manifest unchanged; nothing to commit."
          else
            git commit -m "ci: update manifest for ${{ github.event.release.tag_name }}"
            git push origin "${METADATA_BRANCH}"
          fi
